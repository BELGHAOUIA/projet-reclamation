# -----------------------------------------------------------------------
# Global Parameters
# -----------------------------------------------------------------------
global.params.p1=555
global.params.p2=777

# -----------------------------------------------------------------------
# Notification Service Configuration
# -----------------------------------------------------------------------
notification-service.port=8000
notification-service.base-url=http://localhost:8000

# -----------------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
spring.datasource.url=jdbc:sqlite:notification_db.sqlite3
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update

# -----------------------------------------------------------------------
# Email Configuration
# -----------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=boutheinabelg1@gmail.com
spring.mail.password=cfnf myax xiub iykm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=Notification Service <boutheinabelg1@gmail.com>

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.notification=DEBUG
logging.level.org.springframework.web=INFO

# -----------------------------------------------------------------------
# Pagination & API
# -----------------------------------------------------------------------
app.pagination.default-page-size=10
app.pagination.max-page-size=100

# -----------------------------------------------------------------------
# Service-Specific Configuration
# -----------------------------------------------------------------------
app.notification.retry-attempts=3
app.notification.timeout-seconds=30
app.notification.queue-size=1000

# -----------------------------------------------------------------------
# Actuator Configuration
# -----------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized