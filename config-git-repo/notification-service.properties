# Configuration de l'application
notification-service.port=8003
notification-service.base-url=http://localhost:8003

# Informations pour l'enregistrement Eureka (utilisées par le client Python)
eureka.instance.hostname=localhost
eureka.instance.port=8761
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Secrets (À ne pas mettre en clair en production, utiliser le chiffrement Spring Cloud)
django.secret_key=django-insecure-remote-secret-key-from-config-server
db.password=my-secure-db-password