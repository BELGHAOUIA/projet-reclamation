# Server
server.port=8082

# Application Name
spring.application.name=agent-service
spring.cloud.discovery.enabled=true
# Logging Levels
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=TRACE
logging.level.web=TRACE

# MVC & Request Mapping
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/agent_db?useSSL=false&createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create

# Hibernate Properties
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false


camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn,classpath*:/forms/*.form
camunda.bpm.auto-deployment-enabled=true
